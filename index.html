<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice Desk — Metal guitar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ff4e2a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/glory.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="desk">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">Practice Desk</p>
          <h1>Metal guitar</h1>
        </div>
        <div class="top-controls">
          <div class="mix" role="radiogroup" aria-label="Mix">
            <button type="button" class="mix-btn" role="radio" data-mix="click">Click</button>
            <button type="button" class="mix-btn" role="radio" data-mix="kit">Kit</button>
            <button type="button" class="mix-btn" role="radio" data-mix="both" aria-checked="true">Both</button>
          </div>
          <label class="vol">
            <span>Vol</span>
            <input id="volume" type="range" min="-30" max="0" step="1" value="-8" />
          </label>
        </div>
      </header>

      <section class="stage" aria-label="Now playing">
        <p class="kicker" id="pattern-sub">AILD / metalcore</p>
        <h2 id="pattern-name">16th chug</h2>
        <div class="form-meta" id="form-meta" hidden>
          <span id="form-length" class="form-length">1-bar form</span>
          <span id="form-bar-label" class="form-bar-label">Bar 1</span>
        </div>
        <div class="bpm-hero">
          <output id="bpm-value" for="bpm">90</output>
          <span class="bpm-unit">BPM</span>
        </div>
        <p id="status" class="status" aria-live="polite">Ready · space to play</p>
        <div id="beat-pads" class="pads" aria-hidden="true"></div>
        <div id="bar-playhead" class="bar-playhead" aria-label="Form playhead" hidden></div>
      </section>

      <section class="grid-panel" aria-label="16th grid">
        <div class="grid-head">
          <span class="grid-title">Subdivision</span>
          <span id="step-syllable" class="syllable-now">1</span>
        </div>
        <div id="syllables" class="syllables"></div>
        <div id="step-grid" class="step-grid"></div>
        <div id="track-rows" class="tracks"></div>
      </section>

      <section class="transport" aria-label="Transport">
        <button id="play" type="button" class="play">Play</button>
        <label class="bpm-slider">
          <span>Tempo</span>
          <input id="bpm" type="range" min="50" max="180" value="90" />
        </label>
        <div id="pattern-chips" class="chips" role="listbox" aria-label="Patterns"></div>
      </section>

      <section class="neck-panel" aria-label="Scale viewer">
        <div class="grid-head">
          <span class="grid-title">Fretboard</span>
          <span id="scale-formula" class="scale-formula">A harmonic minor</span>
        </div>
        <div class="neck-controls">
          <label class="field">
            <span>Scale</span>
            <select id="scale-select"></select>
          </label>
          <label class="field">
            <span>Root</span>
            <select id="root-select"></select>
          </label>
        </div>
        <div class="drill-row">
          <span class="drill-label">Neck drills</span>
          <div id="drill-chips" class="chips drill-chips" role="listbox" aria-label="Neck drills"></div>
        </div>
        <div id="scale-patterns" class="chips" role="listbox" aria-label="Scale patterns"></div>
        <p id="scale-hint" class="hint"></p>
        <div id="fretboard" class="fretboard"></div>
      </section>

      <section class="extras">
        <label class="check">
          <input id="count-in" type="checkbox" checked />
          <span>Count-in</span>
        </label>
        <label class="check">
          <input id="riff-lock" type="checkbox" />
          <span>Riff lock</span>
        </label>
        <details class="ramp">
          <summary>BPM ramp</summary>
          <div class="ramp-body">
            <label class="check">
              <input id="ramp-enabled" type="checkbox" />
              <span>Enable</span>
            </label>
            <div class="ramp-row">
              <label class="field">
                <span>Start</span>
                <input id="ramp-start" type="number" min="50" max="160" value="70" />
              </label>
              <label class="field">
                <span>Target</span>
                <input id="ramp-target" type="number" min="50" max="180" value="120" />
              </label>
              <label class="field">
                <span>Bars</span>
                <input id="ramp-bars" type="number" min="1" max="16" value="2" />
              </label>
              <label class="field">
                <span>+BPM</span>
                <input id="ramp-step" type="number" min="1" max="20" value="5" />
              </label>
            </div>
          </div>
        </details>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
